name: Wails Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Path to the Wails project directory
  WORKING_DIRECTORY: ./

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        check-latest: true

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Wails
      run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

    - name: Build Application
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        wails build -platform ${{ matrix.os == 'macOS' && 'darwin/universal' || 'linux/amd64' }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ApiDracin-${{ matrix.os }}
        path: ${{ env.WORKING_DIRECTORY }}/build/bin/*
