name: Wails Build
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  WORKING_DIRECTORY: ./

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          check-latest: true
          cache: true
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            pkg-config \
            upx
      
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      
      - name: Build Application
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: wails build -platform linux/amd64
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ApiDracin-linux-amd64
          path: ./build/bin/*
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          check-latest: true
          cache: true
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install UPX
        run: choco install upx -y
      
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      
      - name: Build Application
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: wails build -platform windows/amd64
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ApiDracin-windows-amd64
          path: ./build/bin/*.exe
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          check-latest: true
          cache: true
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install UPX
        run: brew install upx
      
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      
      - name: Build Application
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: wails build -platform darwin/universal
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ApiDracin-macos-universal
          path: ./build/bin/
          if-no-files-found: warn

  release:
    needs: [ build-linux, build-windows, build-macos ]
    runs-on: ubuntu-latest
    # Hanya release saat push ke main (bukan PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List artifacts
        run: find ./artifacts -type f

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          name: "Build ${{ steps.sha.outputs.short }}"
          body: |
            Auto release from commit ${{ github.sha }}
            
            **Commit message:** ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/ApiDracin-linux-amd64/*
            ./artifacts/ApiDracin-windows-amd64/*
            ./artifacts/ApiDracin-macos-universal/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
